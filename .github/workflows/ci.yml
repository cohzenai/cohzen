name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Code Quality (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.4.0

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Formatting Check
        run: ruff format --check .

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite with pytest & coverage
        run: |
          pytest --cov=cz --cov-report=xml --cov-report=term-missing tests/

      - name: Verify CLI smoke tests
        run: |
          cz --help
          cohzen --help
          cz version
          cz scan examples/langgraph-basic
          cz audit tests/fixtures/sample_graphs --min-coverage 10

  langgraph-contract:
    name: LangGraph Contract (${{ matrix.langgraph-spec }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        langgraph-spec:
          - "langgraph~=0.2.76"
          - "langgraph~=1.0.10"
          - "langgraph~=1.1.10"
          - "langgraph~=1.2.16"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies with specific LangGraph version
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "${{ matrix.langgraph-spec }}"

      - name: Verify LangGraph contract tests
        run: |
          pytest -v tests/test_runtime_contracts.py

  cohzen-agent-gate:
    name: Dogfood Cohzen CI Action
    needs: [test, langgraph-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Cohzen Agent Gate Action
        uses: ./
        with:
          path: "tests/fixtures/sample_graphs"
          min-coverage: "10"
          export-manifest: "true"
          export-mermaid: "true"
          comment-pr: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
