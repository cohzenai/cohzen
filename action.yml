name: "Cohzen Agent CI/CD Gate"
description: "Static LangGraph architecture reconstruction, telemetry compliance audit, and PR visualization."
author: "Cohzen"
branding:
  icon: "activity"
  color: "purple"

inputs:
  path:
    description: "Path to repository or directory to scan/audit (defaults to repository root)"
    required: false
    default: "."
  min-coverage:
    description: "Minimum agent/node telemetry instrumentation percentage required (0-100). Fails CI if not met."
    required: false
    default: ""
  fail-on-missing-telemetry:
    description: "Fail the build if no LLM observability package or environment config is detected (true/false)"
    required: false
    default: "false"
  export-manifest:
    description: "Upload CohzenManifest JSON as build artifact (true/false)"
    required: false
    default: "true"
  export-mermaid:
    description: "Upload Mermaid architecture diagram as build artifact (true/false)"
    required: false
    default: "true"
  comment-pr:
    description: "Post or update sticky PR comment with architecture flowchart and audit scorecard (true/false)"
    required: false
    default: "true"
  github-token:
    description: "GitHub token for commenting on pull requests"
    required: false
    default: ${{ github.token }}
  python-version:
    description: "Python version to use if Python setup is required"
    required: false
    default: "3.11"

outputs:
  total-graphs:
    description: "Number of agentic graphs detected"
    value: ${{ steps.cz-gate.outputs.total_graphs }}
  total-nodes:
    description: "Number of agent/node handlers detected"
    value: ${{ steps.cz-gate.outputs.total_nodes }}
  total-tools:
    description: "Number of @tool functions detected"
    value: ${{ steps.cz-gate.outputs.total_tools }}
  instrumentation-pct:
    description: "Observed agent telemetry instrumentation percentage"
    value: ${{ steps.cz-gate.outputs.instrumentation_pct }}
  manifest-path:
    description: "Path to generated manifest.json"
    value: ${{ steps.cz-gate.outputs.manifest_path }}
  mermaid-path:
    description: "Path to generated architecture.mmd"
    value: ${{ steps.cz-gate.outputs.mermaid_path }}

runs:
  using: "composite"
  steps:
    - name: Ensure Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        check-latest: false

    - name: Install Cohzen CLI
      shell: bash
      run: |
        if ! command -v cz &> /dev/null; then
          if [ -f "${{ github.action_path }}/pyproject.toml" ]; then
            pip install -e "${{ github.action_path }}"
          else
            pip install cohzen
          fi
        fi

    - name: Run Cohzen CI Gate & Generate Artifacts
      id: cz-gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        CMD_ARGS=(
          "--path" "${{ inputs.path }}"
          "--manifest-output" "cz-manifest.json"
          "--mermaid-output" "cz-architecture.mmd"
          "--audit-output" "cz-audit.json"
        )

        if [ -n "${{ inputs.min-coverage }}" ]; then
          CMD_ARGS+=("--min-coverage" "${{ inputs.min-coverage }}")
        fi

        if [ "${{ inputs.fail-on-missing-telemetry }}" = "true" ]; then
          CMD_ARGS+=("--fail-on-missing")
        fi

        if [ "${{ inputs.comment-pr }}" = "true" ]; then
          CMD_ARGS+=("--comment-pr")
        fi

        python "${{ github.action_path }}/scripts/ci_gate.py" "${CMD_ARGS[@]}"

    - name: Upload Cohzen Architecture Manifest
      if: inputs.export-manifest == 'true' && always()
      uses: actions/upload-artifact@v7
      with:
        name: cohzen-manifest
        path: cz-manifest.json
        if-no-files-found: ignore

    - name: Upload Cohzen Mermaid Architecture Diagram
      if: inputs.export-mermaid == 'true' && always()
      uses: actions/upload-artifact@v7
      with:
        name: cohzen-mermaid
        path: cz-architecture.mmd
        if-no-files-found: ignore

    - name: Upload Cohzen Observability Audit
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: cohzen-audit
        path: cz-audit.json
        if-no-files-found: ignore
