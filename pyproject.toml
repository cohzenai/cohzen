[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohzen"
version = "0.2.0"
description = "Fast, static scanner for LangGraph architectures: detecting compiled graphs, agents, and routing edges."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Cohzen contributors", email = "dev@cohzen.ai" },
]
keywords = ["langgraph", "langchain", "agents", "cli", "ast-scanner", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
runtime = [
    # Optional: static scanning intentionally has no framework runtime dependency.
    "langgraph>=0.2,<1.3",
    "langchain-core>=0.2,<1.7",
    "opentelemetry-api>=1.20,<2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
]

[project.scripts]
cz = "cz.cli.main:app"
cohzen = "cz.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    ".git",
    "dist",
    "build",
    "*.ipynb",
    "tests/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cz"]
