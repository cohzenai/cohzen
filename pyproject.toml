[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cz-cli"
version = "0.1.0"
description = "Fast, static scanner for LangGraph architectures: detecting compiled graphs, agents, and routing edges."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Cohzen", email = "dev@cohzen.ai" },
]
keywords = ["langgraph", "langchain", "agents", "cli", "ast-scanner", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
cz = "cz.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
